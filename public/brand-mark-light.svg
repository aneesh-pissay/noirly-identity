<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Noirly Identity mark">
  <title>Noirly Identity — monochrome</title>
  <desc>A shield with a keyhole: one key, every Noirly door.</desc>
  <!-- Default tint for standalone use. Delete this rule to inherit color from the parent.
       Plain currentColor shapes only (no masks/clipPaths) so theming code can recolor it safely. -->
  <style>svg { color: #8a6b00; }</style>
  <!-- Shield with a keyhole knocked out (evenodd), softened by a round-joined stroke -->
  <path fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="40" stroke-linejoin="round"
        d="M512 168 L804 276 V492 C804 676 684 800 512 864 C340 800 220 676 220 492 V276 Z
           M468 540 A100 100 0 1 1 556 540 L586 708 H438 Z"/>
</svg>
